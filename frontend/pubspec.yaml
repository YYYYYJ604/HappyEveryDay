name: happy_every_day
description: "天天开心 - 反焦虑生活陪伴平台 Flutter 前端"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ─── 状态管理 ───
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ─── 路由 ───
  go_router: ^14.8.1

  # ─── 网络 ───
  dio: ^5.7.0
  retrofit: ^4.4.2
  json_annotation: ^4.9.0

  # ─── 本地存储 ───
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4

  # ─── UI 组件 ───
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # ─── 工具 ───
  intl: ^0.19.0
  logger: ^2.5.0
  freezed_annotation: ^2.4.4
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ─── 代码生成 ───
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  retrofit_generator: ^9.1.7
  json_serializable: ^6.9.3
  freezed: ^2.5.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/icons/
    - assets/images/illustrations/
    - assets/animations/
    - assets/json/
    - assets/fonts/

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
